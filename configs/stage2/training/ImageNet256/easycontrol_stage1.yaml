stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'Dinov2withNorm'
    encoder_config_path: 'facebook/dinov2-with-registers-base'
    encoder_input_size: 224
    encoder_params:
      dinov2_path: 'facebook/dinov2-with-registers-base'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    pretrained_decoder_path: 'models/decoders/dinov2/wReg_base/ViTXL_n08/model.pt'
    noise_tau: 0.0
    reshape_to_2d: true
    normalization_stat_path: 'models/stats/dinov2/wReg_base/imagenet1k/stat.pt'

stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 16
    patch_size: 1
    in_channels: 768
    hidden_size: [1152, 2048]
    depth: [28, 2]
    num_heads: [16, 16]
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 1000
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true

transport:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 30
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

guidance:
  method: 'cfg'
  scale: 1.0
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [768, 16, 16] # [C, H, W]
  num_classes: 1000
  time_dist_shift_dim: 196608 # 16*16*768
  time_dist_shift_base: 4096
  
# eval:
#   eval_interval: 25000 # every 10 epochs
#   eval_model: true
#   data_path: 'data/imagenet/val/'
#   reference_npz_path: 'data/imagenet/VIRTUAL_imagenet256_labeled.npz'


training:
  dit_checkpoint: /home/bjia-25/workspace/papers/RAE/code/rae_project/RAE_MIX/models/DiTs/Dinov2/wReg_base/ImageNet256/DiTDH-XL/stage2_model.pt

  max_steps: 10000
  global_seed: 42
  num_workers: 16

  batch_size: 2
  log_every: 100
  sample_every: 5000
  save_every: 5000

  global_batch_size: 2
  log_interval: 1000
  checkpoint_interval: 10000

  # -------- data dropout --------
  edge_dropout: 0.0
  label_drop_rate: 0.1

  ilsvrc_class_index: /home/bjia-25/workspace/papers/RAE/code/rae_project/RAE_MIX/assets/imagenet_class_index.json

  # -------- control strength --------
  # stage1: force control always on
  control_scale_train_max: 1.5
  control_scale_train: 1.5
  randomize_control_scale_train: false

  # sample: stronger for clearer control visibility
  control_scale_sample: 2.0
  ablation_control_scale: 10.0

  # -------- CFG --------
  cfg_scale: 1.5
  cfg_t_min: 0.0
  cfg_t_max: 1.0

  # -------- adapter hyperparams --------
  condition_latent_dim: 768
  condition_patch_size: 4
  lora_rank: 16
  lora_alpha: 16.0
  qkv_scale: 0.01
  control_clamp: 5.0
  encoder_layer_decay: 0.98
  decoder_layer_decay: 0.95
  encoder_warmup_steps: 1000
  control_scale_warmup_steps: 5000
  control_scale_warmup_factor: 0.5

  # -------- optimizer --------
  lr: 1.0e-4
  optimizer:
    lr: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0

  # keep your scheduler section if you want; for overnight debug it's optional
  scheduler:
    type: linear
    warmup_epochs: 0
    decay_end_epoch: 0
    base_lr: 1.0e-4
    final_lr: 1.0e-4
    warmup_from_zero: false
